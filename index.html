<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta de Premios</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Logo superior izquierdo -->
    <img src="logoakuma.png" alt="Logo Akuma" class="top-logo">

    <!-- Ruleta Principal -->
    <div id="mainWheelContainer" class="wheel-container">
        <div class="wheel-wrapper">
            <div class="wheel-pointer">
                <div class="pointer-shape"><div class="pointer-dot"></div></div>
            </div>
            <div class="wheel-bezel">
                <canvas id="mainWheelCanvas" class="wheel-canvas" width="800" height="800"></canvas>
            </div>
            <div class="wheel-center" id="mainCenterSpin"></div>
        </div>
    </div>

    <!-- Ruleta Caja Misteriosa -->
    <div id="mysteryWheelContainer" class="wheel-container mystery-theme" style="display: none;">
        <div class="wheel-wrapper">
            <!-- Personajes a los lados -->
            <img src="akumapersona.png" class="character-akuma" alt="Akuma">
            <img src="karolgpersona.png" class="character-karolg" alt="Karol G">

            <div class="mystery-pointer">♥</div>
            <div class="wheel-bezel mystery-bezel">
                <!-- Luces de neon alrededor -->
                <div class="neon-lights"></div>
                <canvas id="mysteryWheelCanvas" class="wheel-canvas" width="800" height="800"></canvas>
            </div>
            <div class="wheel-center mystery-center" id="mysteryCenterSpin"></div>
            
            <!-- Base de la ruleta -->
            <img src="baseruleta.png" class="mystery-base-img" alt="Base Akuma_x10">
        </div>
    </div>

    <!-- Ventana emergente de premio -->
    <div class="modal" id="prizeModal">
        <div class="modal-content">
            <h3 class="modal-title">¡FELICIDADES!</h3>
            <p>Has ganado:</p>
            <div class="modal-prize" id="prizeText"></div>
            <button class="modal-close" id="closeModal">Aceptar</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
